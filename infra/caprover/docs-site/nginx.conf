# ═════════════════════════════════════════════════════════════════════════════
# TerraColombia — nginx para el portal de desarrolladores (VitePress estático)
#
# `__CSP_CONNECT_SRC__` lo reemplaza el Dockerfile: el *playground* de la
# documentación hace peticiones reales a la GeoAPI, así que su origen tiene que
# estar en `connect-src`.
# ═════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # El *playground* de la API necesita `connect-src` hacia la GeoAPI.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' __CSP_CONNECT_SRC__; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location = /health.txt {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # El `openapi.json` publicado se refresca en cada despliegue: caché corta.
    location = /openapi.json {
        add_header Cache-Control "public, max-age=300" always;
        default_type application/json;
    }

    # Rutas limpias de VitePress.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    error_page 404 /404.html;
}
