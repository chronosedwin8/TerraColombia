# ═════════════════════════════════════════════════════════════════════════════
# TerraColombia — nginx para la SPA de Vue
#
# Solo sirve archivos estáticos. El TLS, el dominio y el enrutamiento entre
# apps los pone el proxy de CapRover por delante.
#
# Los marcadores `__CSP_CONNECT_SRC__` y `__CSP_IMG_SRC__` los reemplaza el
# `Dockerfile` en tiempo de construcción con los orígenes reales (la API y los
# servidores de teselas/ortoimágenes). Ver docs/SEGURIDAD.md §CSP.
# ═════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de nginx.
    server_tokens off;

    charset utf-8;
    charset_types text/plain text/css application/json application/javascript image/svg+xml;

    # ─── Compresión ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/geo+json
        application/wasm
        image/svg+xml
        font/woff2;

    # Sirve el `.br` precomprimido por Vite si existe (menos CPU por petición).
    # Requiere el módulo brotli_static, que la imagen alpine de nginx no trae;
    # se deja documentado y desactivado a propósito:
    # brotli_static on;

    # ─── Cabeceras de seguridad ─────────────────────────────────────────────
    # La política completa y su justificación están en docs/SEGURIDAD.md.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    # HSTS: lo emite también CapRover; aquí por si se sirve directo.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP.
    #   · `worker-src blob:` y `child-src blob:` son OBLIGATORIOS para MapLibre
    #     GL JS: crea sus workers de teselas desde blobs.
    #   · `style-src 'unsafe-inline'`: MapLibre y ECharts inyectan estilos en
    #     línea. Se acota a estilos, nunca a scripts.
    #   · `script-src` sin 'unsafe-inline' ni 'unsafe-eval': el bundle de Vite
    #     no los necesita.
    #   · `img-src` incluye `data:` y `blob:` (iconos y mapas estáticos) más los
    #     orígenes de ortoimágenes/WMS del IGAC que se inyecten al construir.
    #   · `frame-ancestors 'none'`: el visor no se embute en iframes ajenos
    #     (anti-scraping y anti-clickjacking).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: __CSP_IMG_SRC__; font-src 'self' data:; connect-src 'self' __CSP_CONNECT_SRC__; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # ─── Salud (lo mira el HEALTHCHECK y el proxy de CapRover) ──────────────
    location = /health.txt {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ─── Activos con huella en el nombre: caché eterna ──────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Teselas PMTiles servidas como estático (mapa base propio). Aceptan
    # peticiones por rango, que es como las lee MapLibre.
    location ~* \.pmtiles$ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header Accept-Ranges "bytes" always;
        try_files $uri =404;
    }

    location ~* \.(woff2|woff|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ─── index.html: NUNCA en caché ─────────────────────────────────────────
    # Si se cachea, un usuario puede quedarse con un index que apunta a
    # bundles que ya no existen tras un despliegue.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires off;
    }

    # ─── SPA: cualquier ruta desconocida devuelve index.html ────────────────
    # Todas las vistas de TerraColombia son enlaces compartibles (PLAN §10.3),
    # así que `/predio/08001...` tiene que resolver en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No servir archivos ocultos ni copias de seguridad de editores.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Límite de tamaño de cuerpo: la web no sube archivos (los GeoJSON de
    # usuario se envían a la API, que tiene su propio límite).
    client_max_body_size 1m;

    error_page 404 /index.html;
}
